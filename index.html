<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/media/brand/renee-icon.png" />
    <link rel="apple-touch-icon" href="/media/brand/renee-icon.png" />
    <meta name="theme-color" content="#000000" />

    <!-- Sayfaya özel başlık, açıklama, canonical, hreflang, Open Graph ve
         JSON-LD etiketleri derleme sırasında buraya yazılır
         (scripts/prerender.mjs). -->
    <!--seo-->
    <title>Renee Design Lab | Ankara Tasarım ve Reklam Ajansı</title>
    <!--/seo-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      />
      <!-- JavaScript kapalıyken kayarak giriş animasyonlu içerik gizli kalmasın. -->
      <style>
        .rv, .rv-line, .rv-word, .fade-in { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["ProfessionalService", "Organization"],
        "@id": "https://www.reneedesignlab.com/#organization",
        "name": "Renee Design Lab",
        "alternateName": "Renee",
        "description": "Ankara merkezli tasarım ve reklam ajansı: kurumsal kimlik, logo tasarımı, web tasarım ve geliştirme, sosyal medya yönetimi, dijital pazarlama, SEO, 3D render ve prodüksiyon.",
        "url": "https://www.reneedesignlab.com/",
        "logo": "https://www.reneedesignlab.com/media/brand/renee-logo.png",
        "image": "https://www.reneedesignlab.com/media/general/renee-2.jpg",
        "email": "info@reneedesignlab.com",
        "telephone": "+90-532-504-66-06",
        "founder": { "@type": "Person", "name": "Egemen Cengiz" },
        "sameAs": [
          "https://www.instagram.com/reneedesignlab/",
          "https://www.linkedin.com/company/renee-designlab/",
          "https://x.com/ReneeDesignLab"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ODTÜ Teknokent",
          "addressLocality": "Çankaya",
          "addressRegion": "Ankara",
          "addressCountry": "TR"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "telephone": "+90-532-504-66-06",
          "email": "info@reneedesignlab.com",
          "availableLanguage": ["Turkish", "English"]
        },
        "areaServed": [
          { "@type": "City", "name": "Ankara" },
          { "@type": "Country", "name": "Türkiye" }
        ],
        "slogan": "Yaratıcılığın işaret ettiği sınırların ötesinde",
        "knowsLanguage": ["tr", "en"],
        "knowsAbout": [
          "Kurumsal Kimlik Tasarımı",
          "Logo Tasarımı",
          "Web Tasarım ve Geliştirme",
          "Sosyal Medya Yönetimi",
          "Dijital Pazarlama ve SEO",
          "Marka Stratejisi",
          "3D Ürün Renderı",
          "Prodüksiyon",
          "Google ve Meta Reklam Yönetimi",
          "Influencer Marketing"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
